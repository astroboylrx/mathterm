name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: gcc-11
      CXX: g++-11

    steps:
      - name: Install system build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            fakeroot \
            file \
            git \
            libarchive-tools \
            python3 \
            rpm \
            software-properties-common \
            xz-utils
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends g++-11

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Verify native PTY compatibility
        shell: bash
        run: |
          pty_module="$(find dist-electron -path '*/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node' -print -quit)"
          app_binary="$(find dist-electron -path '*/linux*-unpacked/mathterm' -print -quit)"
          test -n "$pty_module"
          test -n "$app_binary"

          verify_shared_libraries() {
            local binary="$1"
            local output
            output="$(ldd "$binary" 2>&1 || true)"
            echo "$output"
            if grep -q "not found" <<<"$output"; then
              echo "$binary has unresolved shared-library dependencies" >&2
              exit 1
            fi
          }

          file "$app_binary"
          file "$pty_module"
          verify_shared_libraries "$pty_module"
          echo "Highest required glibc symbol:"
          readelf --version-info "$pty_module" \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -1

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: mathterm-linux-${{ matrix.arch }}
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2025
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows packages
        run: npm run dist:win

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: mathterm-windows-x64
          path: |
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "MathTerm $GITHUB_REF_NAME"
